name: Android APK

# The dev machines don't carry an Android toolchain; GitHub's ubuntu-latest
# runners do (SDK + build-tools preinstalled, JDK pinned below). This job
# prebuilds the native project on the runner — apps/mobile/android is
# intentionally NOT committed — produces an installable APK and uploads it
# as a workflow artifact. Tag pushes under v* build automatically so a
# Release can attach the APK; manual dispatch is for ad-hoc test builds.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Least privilege: this job only checks out the repo and uploads an artifact,
# both of which work with read-only contents.
permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project (expo prebuild)
        # SDK 53 flags: -p selects the platform, --no-install skips a second
        # pnpm pass (deps are already installed above).
        run: pnpm --filter @7xcircle/mobile exec expo prebuild -p android --no-install

      - name: Build the debug APK
        # Debug signing: installable for field testing without a release
        # keystore. Release signing comes once the wallet keystore exists
        # (see PRIVACY/release-secrets discussion) — do not ship release
        # APKs signed with a debug key.
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 7xcircle-wallet-android-v0-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
