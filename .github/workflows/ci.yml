name: CI

on:
  push:
    # Dependabot branches already run the same checks via `pull_request`;
    # scanning the `push` too double-ran every bot commit (and the bot's
    # `event.before` sha is often unfetchable after a force-update — see
    # secret-scan's BASE resolution below).
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main]

# Least privilege: every job below only reads the repository. Declaring that
# explicitly keeps a future job from silently inheriting the default token
# scope. Artifact upload does not need write access — it uses the runtime
# token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  commit-lint:
    name: Conventional Commits
    # Dependabot's security-update commits ("Bump X from Y to Z") are not
    # conventional by design; humans are still held to the format.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check every commit in the pushed range
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          # Resolve a BASE that actually exists as an object in this clone.
          # `event.before` is all-zeros on a branch's first push and can point
          # at an orphaned commit after a force-push — an unfetchable sha makes
          # every git command against the range die with "Invalid revision
          # range", which must not masquerade as a pass or a lint failure.
          ZERO=0000000000000000000000000000000000000000
          valid() { [ -n "$1" ] && [ "$1" != "$ZERO" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          BASE="$PUSH_BEFORE"
          valid "$BASE" || BASE="$PR_BASE"
          valid "$BASE" || BASE=$(git merge-base HEAD origin/main 2>/dev/null || true)
          valid "$BASE" || BASE=$(git rev-parse HEAD~10 2>/dev/null || git rev-parse HEAD)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then RANGE='HEAD^1..HEAD'; else RANGE="$BASE..HEAD"; fi
          echo "Linting commit subjects in $RANGE"
          # Previously this grepped the last-10 subjects as one blob, so ANY
          # conforming commit whitewashed nine non-conforming ones — including
          # the newest push. Check every subject individually instead.
          STATUS=0
          while IFS= read -r subject; do
            if echo "$subject" | grep -qE '^(feat|fix|docs|refactor|chore|test|build|ci|perf|style|revert)(\(.+\))?: '; then
              echo "✅ $subject"
            else
              echo "❌ not in Conventional Commits format: $subject"
              STATUS=1
            fi
          done < <(git log --no-merges --pretty=%s "$RANGE")
          exit $STATUS

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan pushed diff
        env:
          # What this push/PR actually introduces. A fixed `HEAD~5..HEAD`
          # window silently missed secrets pushed 6+ commits ago and
          # rescanned already-reviewed history.
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Resolve a BASE that exists in this clone: `event.before` is
          # all-zeros on a branch's first push and can point at a commit that
          # was never fetched after a bot force-push — diffing against it dies
          # with "Invalid revision range". Fall back to the PR base, the
          # merge-base with main, then HEAD~5, then HEAD itself.
          ZERO=0000000000000000000000000000000000000000
          valid() { [ -n "$1" ] && [ "$1" != "$ZERO" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          BASE="$PUSH_BEFORE"
          valid "$BASE" || BASE="$PR_BASE"
          valid "$BASE" || BASE=$(git merge-base HEAD origin/main 2>/dev/null || true)
          valid "$BASE" || BASE=$(git rev-parse HEAD~5 2>/dev/null || git rev-parse HEAD)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then RANGE='HEAD^1..HEAD'; else RANGE="$BASE..HEAD"; fi
          echo "Scanning $RANGE"
          # Exclude test files (they contain known test vectors — tx hashes,
          # EIP-712 digests — that are 64-char hex but NOT secrets).
          # Also exclude lockfiles and node_modules.
          DIFF=$(git diff "$RANGE" -- . \
            ':!node_modules' ':!pnpm-lock.yaml' \
            ':!*.test.*' ':!*.spec.*' \
            ':!scripts/*-test.ts' ':!scripts/ens-test.ts') \
            || { echo '❌ git diff failed — refusing to pass silently'; exit 1; }
          echo "$DIFF" | \
            grep -nE '(sk-[A-Za-z0-9]{16,}|0x[0-9a-fA-F]{64}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|api[_-]?key[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']{8,})' \
            && { echo '❌ Potential secret in diff'; exit 1; } || echo '✅ No secrets in diff'
      - name: Scan working tree
        run: |
          grep -rnE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|sk-[A-Za-z0-9]{16,})' --include='*' . \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            && { echo '❌ Secret-like content found'; exit 1; } || echo '✅ Tree clean'

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Real per-package test runs via turbo; fails if a suite breaks.
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Structural integrity of the pipeline itself: every package declares how
      # it is tested, no suite can pass by being empty, coverage floors are
      # intact, and no action has been un-pinned. This is the check that would
      # have caught the 2026-09 stretch where CI was green with zero tests.
      - run: pnpm exec tsx scripts/gate-selfcheck.ts
      - run: pnpm build
      # Fails closed if the built extension's manifest can't load in Chrome
      # (missing _locales for default_locale, dangling file refs).
      - run: pnpm exec tsx scripts/ext-manifest-check.ts

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Run coverage with thresholds — fails if lines/functions/statements < 60%
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
