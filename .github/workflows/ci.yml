name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check last 10 commits
        run: |
          set -e
          git log -10 --pretty=%s | grep -E '^(feat|fix|docs|refactor|chore|test|build|ci|perf|style|revert)(\(.+\))?: ' \
            || { echo '❌ Commit message not in Conventional Commits format'; exit 1; }

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan pushed diff
        env:
          # What this push/PR actually introduces. A fixed `HEAD~5..HEAD`
          # window silently missed secrets pushed 6+ commits ago and
          # rescanned already-reviewed history.
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # `event.before` is all-zeros on a branch's first push; fall back to
          # the PR base, then the merge-base with main, then HEAD (empty diff).
          ZERO=0000000000000000000000000000000000000000
          BASE="$PUSH_BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            BASE="$PR_BASE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            BASE=$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse --verify HEAD~5 2>/dev/null || git rev-parse HEAD)
          fi
          echo "Scanning ${BASE}..HEAD"
          # Exclude test files (they contain known test vectors — tx hashes,
          # EIP-712 digests — that are 64-char hex but NOT secrets).
          # Also exclude lockfiles and node_modules.
          DIFF=$(git diff "$BASE..HEAD" -- . \
            ':!node_modules' ':!pnpm-lock.yaml' \
            ':!*.test.*' ':!*.spec.*' \
            ':!scripts/*-test.ts' ':!scripts/ens-test.ts') \
            || { echo '❌ git diff failed — refusing to pass silently'; exit 1; }
          echo "$DIFF" | \
            grep -nE '(sk-[A-Za-z0-9]{16,}|0x[0-9a-fA-F]{64}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|api[_-]?key[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']{8,})' \
            && { echo '❌ Potential secret in diff'; exit 1; } || echo '✅ No secrets in diff'
      - name: Scan working tree
        run: |
          grep -rnE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|sk-[A-Za-z0-9]{16,})' --include='*' . \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            && { echo '❌ Secret-like content found'; exit 1; } || echo '✅ Tree clean'

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Real per-package test runs via turbo; fails if a suite breaks.
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Run coverage with thresholds — fails if lines/functions/statements < 60%
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
